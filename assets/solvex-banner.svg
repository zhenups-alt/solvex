<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Solvex — policy-bound autonomy on Solana</title>
  <desc id="desc">Shariah-aware AI asset management. Explainable decisions and user-defined limits. Current release: paper Autopilot and Devnet vault.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1222"/><stop offset="1" stop-color="#1c2940"/></linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)"/>
  <rect x="64" y="63" width="32" height="22" rx="6" fill="#f7c774"/>
  <text x="114" y="83" fill="#f7c774" font-size="18" font-weight="700" letter-spacing="3" font-family="Arial, sans-serif">POLICY-BOUND AUTONOMY</text>
  <text x="60" y="178" fill="#f5f3ed" font-size="76" font-weight="700" letter-spacing="5" font-family="Arial, sans-serif">SOLVEX</text>
  <text x="64" y="228" fill="#f5f3ed" font-size="28" font-family="Arial, sans-serif">Shariah-aware AI asset management for Solana.</text>
  <text x="64" y="270" fill="#a3afc3" font-size="22" font-family="Arial, sans-serif">AI proposes. Independent rules decide. Every decision is explained.</text>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="700">
    <rect x="64" y="317" width="180" height="38" rx="9" fill="#172136" stroke="#f7c774"/>
    <text x="83" y="341" fill="#f7c774">PAPER AUTOPILOT</text>
    <rect x="258" y="317" width="166" height="38" rx="9" fill="#172136" stroke="#73d8b1"/>
    <text x="282" y="341" fill="#73d8b1">DEVNET VAULT</text>
  </g>
  <g transform="translate(986 78)">
    <path d="M0 28L92 0l92 28-18 130-74 61-74-61Z" fill="#172136" stroke="#f7c774" stroke-width="3"/>
    <path d="m52 99 28 29 54-65" fill="none" stroke="#f7c774" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="92" y="272" text-anchor="middle" fill="#a3afc3" font-size="16" font-family="Arial, sans-serif">POLICY BEFORE EXECUTION</text>
  </g>
</svg>
