services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: solvex
      POSTGRES_USER: solvex
      POSTGRES_PASSWORD: solvex
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solvex -d solvex"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - solvex-postgres:/var/lib/postgresql/data

volumes:
  solvex-postgres:
